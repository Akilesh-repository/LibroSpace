<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Account | LibroSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontWeight: {
                        semibold: '500',
                        bold: '600',
                        extrabold: '800',
                        black: '900'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================
           CORE STYLES & VARIABLES (LIBROSPACE THEME)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* STRICT NO SCROLL LOCK FROM TEMPLATE */
        html,
        body {
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden !important;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* === LIBROSPACE THEME VARIABLES === */
        :root {
            /* Immersive Glass Backgrounds */
            --bg-card: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-main: #0F172A;
            --text-muted: #475569;

            /* Inputs */
            --input-bg: rgba(255, 255, 255, 0.6);
            --input-border: rgba(203, 213, 225, 0.8);
            --input-focus-bg: rgba(255, 255, 255, 0.95);
            --input-text: #0F172A;
            --input-icon: #64748B;

            --page-text: #F8FAFC;
            --toggle-bg: rgba(255, 255, 255, 0.3);

            /* Accents & Buttons */
            --accent-color: #0EA5E9;
            --accent-hover: #0284C7;
            --btn-text: #FFFFFF;

            --radius: 24px;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            --btn-shadow: 0 4px 10px 0 rgba(14, 165, 233, 0.3);
            --btn-shadow-hover: 0 8px 15px -3px rgba(14, 165, 233, 0.5);
        }

        /* DARK MODE */
        body.dark-mode {
            --bg-card: rgba(15, 23, 42, 0.75);
            --card-border: rgba(51, 65, 85, 0.6);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;

            --input-bg: rgba(2, 6, 23, 0.4);
            --input-border: rgba(51, 65, 85, 0.8);
            --input-focus-bg: rgba(15, 23, 42, 0.9);
            --input-text: #F8FAFC;
            --input-icon: #94A3B8;

            --page-text: #E2E8F0;
            --toggle-bg: rgba(0, 0, 0, 0.4);

            --accent-color: #38BDF8;
            --accent-hover: #0EA5E9;
            --btn-text: #0F172A;

            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            --btn-shadow: 0 4px 10px 0 rgba(56, 189, 248, 0.2);
            --btn-shadow-hover: 0 8px 15px -3px rgba(56, 189, 248, 0.4);
        }

        body {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* FULL SCREEN IMMERSIVE BACKGROUND */
        .auth-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        .auth-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 10s ease-out;
            animation: slowZoom 20s infinite alternate;
        }
        .auth-bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0.4) 100%);
            transition: background 0.4s ease;
        }
        body.dark-mode .auth-bg-overlay {
            background: linear-gradient(135deg, rgba(2, 6, 23, 0.95) 0%, rgba(15, 23, 42, 0.8) 100%);
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* RTL SUPPORT */
        [dir="rtl"] {
            text-align: right;
        }

        [dir="rtl"] .ml-2 {
            margin-left: 0;
            margin-right: 0.5rem;
        }

        [dir="rtl"] .mr-3 {
            margin-left: 0.75rem;
            margin-right: 0;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 14px;
        }

        [dir="rtl"] .input-field {
            padding: 0 40px 0 14px !important;
        }

        /* =========================================
           TOP CONTROLS BAR
           ========================================= */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 1.5rem 2rem;
            gap: 1rem;
            z-index: 50;
            flex-shrink: 0;
            position: absolute;
            top: 0;
            right: 0;
        }

        .toggle {
            width: 40px;
            height: 22px;
            background: var(--toggle-bg);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .toggle::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 3px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        body.dark-mode .toggle::before {
            left: 19px;
            background: var(--accent-color);
            box-shadow: none;
        }

        .top-btn-text {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--page-text);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .top-btn-text:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(255, 255, 255, 0.2);
        }

        /* MAIN WRAPPER - CENTERED */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1rem;
            z-index: 10;
        }

        /* FROSTED GLASS CARD */
        .register-card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: clamp(1.5rem, 3.5vh, 2.25rem) 2rem;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 2vh, 18px);
            position: relative;
            transition: all 0.3s ease;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HEADERS - EXACT LOGO STYLING FROM PREVIOUS PAGES */
        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 4px;
        }

        .auth-logo a {
            color: var(--text-main) !important;
            text-decoration: none;
        }

        .auth-header {
            text-align: center;
        }

        .auth-header h2 {
            font-size: clamp(1.2rem, 3vh, 1.5rem);
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: clamp(0.75rem, 1.5vh, 0.8rem);
            color: var(--text-muted);
            margin: 0;
            font-weight: 500;
        }

        /* COMPACT VERTICAL FORM (Exact template structural rules & clamps) */
        form {
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 1.5vh, 14px);
            margin: 0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-icon);
            font-size: 0.85rem;
            pointer-events: none;
            transition: color 0.3s;
        }

        .input-field {
            width: 100%;
            height: clamp(40px, 5vh, 44px);
            padding: 0 14px 0 38px;
            border: 1.5px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--input-text);
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            margin: 0;
        }

        .input-field::placeholder {
            color: var(--input-icon);
            opacity: 1;
            font-weight: 400;
        }

        .input-field:hover {
            border-color: #94A3B8;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: var(--input-focus-bg);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
        }

        body.dark-mode .input-field:focus {
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .input-field:focus + .input-icon,
        .input-field:focus ~ .input-icon {
            color: var(--accent-color);
        }

        /* Password Field Specifics */
        .password-field {
            padding-right: 36px !important;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-icon);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            font-size: 0.9rem;
            z-index: 5;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--accent-color);
        }

        [dir="rtl"] .password-field {
            padding-right: 38px !important;
            padding-left: 36px !important;
        }

        [dir="rtl"] .password-toggle {
            right: auto;
            left: 10px;
        }

        /* UTILITY ROW */
        .utility-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 2px 0 0 0;
            padding: 0;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .custom-checkbox input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            height: 16px;
            width: 16px;
            background-color: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .custom-checkbox input:checked~.checkmark {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .custom-checkbox input:checked~.checkmark::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 9px;
        }

        body.dark-mode .custom-checkbox input:checked~.checkmark::after {
            color: var(--text-main);
        }

        /* AUTH BUTTON */
        .auth-btn {
            width: 100%;
            height: clamp(42px, 5vh, 46px);
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-transform: none;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--btn-shadow);
            margin-top: 4px;
        }

        .auth-btn:hover {
            background: var(--accent-hover);
            box-shadow: var(--btn-shadow-hover);
            transform: translateY(-1px);
        }
        .auth-btn:active { transform: translateY(0); }

        /* DIVIDER */
        .divider {
            text-align: center;
            position: relative;
            margin: 4px 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--input-border);
        }

        .divider span {
            position: relative;
            background: var(--bg-card); /* Integrates with glass card */
            padding: 0 12px;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 1;
            border-radius: 50px;
        }

        /* SOCIALS */
        .social-login {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            max-width: 110px;
            height: 40px;
            border: 1.5px solid var(--input-border);
            border-radius: 10px;
            background-color: var(--input-bg);
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .social-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: rgba(14, 165, 233, 0.05);
        }
        body.dark-mode .social-btn:hover {
            background-color: rgba(56, 189, 248, 0.08);
        }

        /* FOOTER LINKS */
        .login-link {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
        }

        .login-link a {
            color: var(--accent-color);
            font-weight: 800;
            text-decoration: none;
            transition: all 0.2s;
        }

        .login-link a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* RESPONSIVENESS PRESERVED FROM TEMPLATE */
        @media (max-width: 400px),
        (max-height: 700px) {
            html,
            body {
                height: auto !important;
                min-height: 100vh !important;
                overflow-y: auto !important;
            }

            .main-wrapper {
                padding-top: 5rem;
                padding-bottom: 2rem;
            }

            .register-card {
                padding: 1.5rem 1.25rem !important;
                width: 95%;
                gap: 12px !important;
                border-radius: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            form {
                gap: 10px !important;
            }

            .auth-header p {
                display: none;
            }

            .input-field {
                height: 38px !important;
                font-size: 0.8rem !important;
            }

            .auth-btn {
                height: 40px !important;
            }

            .social-btn {
                height: 36px !important;
                font-size: 0.9rem !important;
            }

            .utility-row span {
                font-size: 0.65rem !important;
            }
        }
    </style>
</head>

<body>

    <!-- NEW UNIQUE DESIGN: IMMERSIVE FULL-SCREEN BACKGROUND -->
    <div class="auth-bg">
        <img src="images/pexels-zeynep-264150158-38456871.jpg" alt="Library Background">
        <div class="auth-bg-overlay"></div>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="flex items-center gap-2" style="cursor: pointer;"
            onclick="document.getElementById('theme-toggle').click()">
            <i class="fas fa-sun text-xs" style="color: var(--page-text); transition: color 0.3s;"></i>
            <div class="toggle" id="theme-toggle"></div>
            <i class="fas fa-moon text-xs" style="color: var(--page-text); transition: color 0.3s;"></i>
        </div>
        <button id="rtl-toggle" class="top-btn-text">RTL Mode</button>
    </div>

    <!-- MAIN CENTERED CONTENT (Frosted Glass Card) -->
    <div class="main-wrapper">
        <div class="register-card">

            <!-- 100% IDENTICAL LOGO SIZING & PLACEMENT -->
            <div class="auth-logo">
                <a href="index.html" class="inline-flex items-center gap-3 text-2xl font-bold tracking-widest uppercase"
                    style="color: var(--text-main) !important; text-decoration: none;">
                    <i class="fas fa-book-open" style="color: var(--accent-color); font-size: 1.4rem;"></i>
                    LibroSpace
                </a>
            </div>

            <div class="auth-header">
                <h2>Create an Account</h2>
                <p>Join LibroSpace to borrow, read, and connect.</p>
            </div>

            <!-- FORM WITH EXACT TEMPLATE DOM STRUCTURE, NUMBER OF FIELDS, & SIZING -->
            <form id="register-form">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="fname">First Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="fname" class="input-field" placeholder="John" required>
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="lname">Last Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="lname" class="input-field" placeholder="Doe" required>
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="input-field" placeholder="reader@librospace.com" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="input-field password-field" placeholder="••••••••"
                            required>
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" id="toggle-password" tabindex="-1"
                            aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- BUTTON & UTILITY PLACEMENT PRESERVED -->
                <div class="utility-row">
                    <label class="custom-checkbox">
                        <input type="checkbox" required>
                        <div class="checkmark"></div>
                        <span class="ml-2 text-[0.7rem] font-semibold" style="color: var(--text-muted); line-height: 1.2;">I agree to the
                            <a href="#" style="color: var(--accent-color); text-decoration: underline;">Terms</a> & <a
                                href="#"
                                style="color: var(--accent-color); text-decoration: underline;">Privacy</a></span>
                    </label>
                </div>

                <button type="submit" class="auth-btn">Register <i class="fas fa-user-plus ml-2 text-xs"></i></button>
            </form>

            <div class="divider"><span>Or sign up with</span></div>

            <!-- 3 SOCIAL BUTTONS PRESERVED -->
            <div class="social-login">
                <button class="social-btn" type="button" title="Sign up with Google"><i
                        class="fab fa-google"></i></button>
                <button class="social-btn" type="button" title="Sign up with Apple"><i
                        class="fab fa-apple"></i></button>
                <button class="social-btn" type="button" title="Sign up with X"><i
                        class="fa-brands fa-x-twitter"></i></button>
            </div>

            <div class="login-link">
                Already have an account? <a href="login.html">Sign In Here</a>
            </div>

        </div>
    </div>

    <script>
        // --- THEME LOGIC ---
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';

        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.classList.add('active');
        }

        themeToggle.onclick = (e) => {
            e.stopPropagation();
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.classList.toggle('active', isDark);
        };

        // --- RTL LOGIC ---
        const rtlToggle = document.getElementById('rtl-toggle');
        const savedDir = localStorage.getItem('dir') || 'ltr';

        if (savedDir === 'rtl') {
            document.documentElement.dir = 'rtl';
            rtlToggle.innerText = "LTR MODE";
        }

        rtlToggle.onclick = () => {
            const isRTL = document.documentElement.dir === 'rtl';
            document.documentElement.dir = isRTL ? 'ltr' : 'rtl';
            localStorage.setItem('dir', isRTL ? 'ltr' : 'rtl');
            rtlToggle.innerText = isRTL ? 'RTL MODE' : 'LTR MODE';
        };

        // --- PASSWORD TOGGLE LOGIC ---
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        // --- FORM SUBMISSION ---
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Redirecting to login upon successful registration
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
